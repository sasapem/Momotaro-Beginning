<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>桃太郎 どんぶらこ</title>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
 html,body{height:100%}
 body{margin:0;background:#efe4c8;color:#2a2320;overflow:hidden;font-family:"Yuji Syuku","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
 canvas{display:block;position:fixed;inset:0}
 .fuda{background:rgba(245,236,214,.9);box-shadow:0 0 0 2px #2a2320,0 0 0 5px rgba(245,236,214,.9),0 4px 16px rgba(0,0,0,.25);color:#2a2320}
 #kotoba{position:fixed;top:4vh;right:5vw;writing-mode:vertical-rl;font-size:4vh;line-height:1.9;letter-spacing:.18em;padding:3vh 1.5vh;
   white-space:pre;max-height:80vh;transition:opacity 1s}
 #kotoba .k{margin-left:1.2em}
 #daimei{position:fixed;top:4vh;left:4vw;writing-mode:vertical-rl;font-size:9vh;letter-spacing:.25em;line-height:1.1;padding:2vh 1vh}
 #kizu{position:fixed;top:4vh;left:calc(4vw + 13vh);writing-mode:vertical-rl;font-size:3.2vh;letter-spacing:.2em;padding:1.5vh .8vh;display:none}
 #hanko{position:fixed;left:4vw;bottom:4vh;width:6vh;height:6vh;background:#b8332a;color:#f5e9d0;font-size:3.6vh;
   display:flex;align-items:center;justify-content:center;border-radius:4px;box-shadow:inset 0 0 0 2px #f5e9d0,inset 0 0 0 4px #b8332a;opacity:.9}
 #anai{position:fixed;bottom:5vh;width:100%;text-align:center;font-size:3.4vh;letter-spacing:.2em;text-shadow:0 0 8px #efe4c8,0 0 3px #efe4c8;transition:opacity .8s;pointer-events:none}
 #st{position:fixed;bottom:1.5vh;right:2vw;font-size:1.7vh;font-family:sans-serif;opacity:.6}
 .ok{color:#2f7a3a}.ng{color:#b8332a}
 #help{position:fixed;bottom:1.5vh;left:12vh;font-size:1.6vh;opacity:.7;font-family:sans-serif;line-height:1.5;display:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="daimei" class="fuda">桃太郎</div>
<div id="kizu" class="fuda"></div>
<div id="kotoba" class="fuda"></div>
<div id="hanko">桃</div>
<div id="anai">スティックを 左右に たおすと はじまります(← → でも可)<br><small>流れに さからうと すすみにくく、のると ながされすぎます</small></div>
<div id="st"></div>
<div id="onpu" class="fuda" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:4vh;letter-spacing:.15em;padding:2vh 4vh;display:none;z-index:9;text-align:center;line-height:1.7"></div>
<div id="help">スティック左右 / ← → 桃を左右に　Shift+数字 舵に使う軸を変更　C スティックの今の位置を中央にする　(待機中のみ: 1 左右 2 前後 3 横振り 0 川 Space 中央)　+/- 振れ幅　M 音の入/切　R 再接続　H この説明</div>
<script>
const OWNER=(typeof __OWNER__==='undefined')?1:__OWNER__;
const STANDALONE=location.protocol==='file:';   // ファイルとして開いた時(橋渡し役なし)
const c=document.getElementById('c'),x=c.getContext('2d');
const $=id=>document.getElementById(id);
let W,Hh,paper;
function rs(){W=c.width=innerWidth;Hh=c.height=innerHeight;paper=makePaper()}
function makePaper(){const p=document.createElement('canvas');p.width=512;p.height=512;const q=p.getContext('2d');
 const im=q.createImageData(512,512);for(let i=0;i<im.data.length;i+=4){const n=225+Math.random()*30;im.data[i]=n;im.data[i+1]=n-10;im.data[i+2]=n-38;im.data[i+3]=255}
 q.putImageData(im,0,0);return x.createPattern(p,'repeat');}
addEventListener('resize',rs);rs();

// ================= 語り(昔話ふう) =================
const KATARI={
 idle:[["むかし むかし\nあるところに","おおきな 桃が\nどんぶらこ どんぶらこと\n流れてきました"]],
 start:[["桃は 川の流れに\nみを まかせ","岩や 魚を\nよけながら\nくだっていきます"]],
 hayase:[["川は はげしく\nうずをまき","桃は ぐるり ぐるりと\nもまれました"]],
 fish:[["おおきな 鯉が\nよこぎります"]],
 baba:[["川しもで\nおばあさんが\nせんたくを しています","岸に よって\nゆっくり\n白い ぬのへ"]],
 clear:[["おばあさんは\nおおきな 桃を\nひろいあげました"],["いえに もちかえり\n桃を わってみると"],["なかから げんきな\n男の子が うまれました"],["桃太郎と\nなづけられました\n\nめでたし めでたし"]],
 fail_rock:[["桃は 岩にあたって\nわれてしまいました"],["……\n\nもういちど"]],
 fail_miss:[["桃は おばあさんの\nまえを とおりすぎ"],["うみへ 流れて\nいきました\n\nもういちど"]],
 fail_fast:[["桃は はやすぎて\nおばあさんの 手は\nとどきませんでした"],["うみへ 流れて\nいきました\n\nもういちど"]],
 fail_out:[["桃は 岸に\nのりあげて\nとまってしまいました"],["……\n\nもういちど"]],
 sakarau:[["流れに さからうと\n桃は なかなか\nすすみません"]],
 noru:[["流れに のると\n桃は どんどん\nながされます"]],
 shudou:[["……"]],
};
let kScene='',kPage=0,kTimer=0;
function showKotoba(lines,instant){const el=$('kotoba');const html=lines.map(l=>`<span class=k>${l}</span>`).join('');
 if(instant){el.innerHTML=html;el.style.opacity=1;return}
 el.style.opacity=0;setTimeout(()=>{el.innerHTML=html;el.style.opacity=1},1000);}
function katari(scene,instant){if(scene===kScene)return;kScene=scene;kPage=0;kTimer=0;showKotoba(KATARI[scene][0],instant)}
function katariTick(dt){const pages=KATARI[kScene];if(!pages||pages.length<2)return;kTimer+=dt;
 if(kTimer>5.5){kTimer=0;kPage=(kPage+1)%pages.length;showKotoba(pages[kPage])}}


// ================= 音(琴・せせらぎ)  ブラウザ内で合成、音源ファイルなし =================
let AC=null,master=null,river=null,SND={on:true},kotoT=2.5;
try{if(typeof localStorage!=='undefined'&&localStorage.getItem('h3_sound')==='off')SND.on=false}catch(e){}
const HIRA=[293.66,311.13,392,440,466.16,587.33,622.25,783.99,880];   // 平調子(D): 琴の音階
function ensureAudio(){ // キー操作など「人の操作」の中で呼ぶと鳴りはじめる
 if(!AC){const Ctor=(typeof window!=='undefined')&&(window.AudioContext||window.webkitAudioContext);if(!Ctor)return false;
  try{AC=new Ctor()}catch(e){return false}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=SND.on?1:0;master.connect(comp);buildRiver();}
 if(AC.state!=='running')AC.resume();return AC.state==='running'}
function buildRiver(){ // せせらぎ: ピンクノイズを川幅ふうにゆらす
 const sr=AC.sampleRate,len=sr*4,buf=AC.createBuffer(2,len,sr);
 for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let b0=0,b1=0,b2=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;
  b0=0.99765*b0+w*0.0990460;b1=0.96300*b1+w*0.2965164;b2=0.57000*b2+w*1.0526913;d[i]=(b0+b1+b2+w*0.1848)*0.11}}
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=160;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=800;lp.Q.value=0.8;
 const g=AC.createGain();g.gain.value=0;
 const lfo=AC.createOscillator();lfo.frequency.value=0.21;const lg=AC.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
 const lfo2=AC.createOscillator();lfo2.frequency.value=0.34;const lg2=AC.createGain();lg2.gain.value=0.05;lfo2.connect(lg2);lg2.connect(g.gain);lfo2.start();
 src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);src.start();river={g,lp}}
function riverTick(k){ // 速さと早瀬で せせらぎの大きさ・明るさを変える
 if(!river)return;const sp=mode==='play'?G.speed:4.5;
 let vol=mode==='clear'?0.12:0.28+(k-1)*0.5+Math.max(0,sp-4.5)*0.05;
 const fq=650+(k-1)*1800+Math.max(0,sp-4.5)*60;
 const t0=AC.currentTime;river.g.gain.setTargetAtTime(Math.min(0.8,vol),t0,0.4);river.lp.frequency.setTargetAtTime(fq,t0,0.5)}
function pluck(freq,when,vol,dur){ // 琴: はじいて減衰、最初だけ少し押し手
 if(!AC||!SND.on)return;when=when||0;vol=vol==null?0.45:vol;dur=dur||1.8;const t0=AC.currentTime+when;
 const o=AC.createOscillator();o.type='triangle';o.frequency.setValueAtTime(freq*1.012,t0);o.frequency.exponentialRampToValueAtTime(freq,t0+0.09);
 const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=freq*2.005;const g2=AC.createGain();g2.gain.value=0.22;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq*7,t0);f.frequency.exponentialRampToValueAtTime(freq*1.4,t0+dur);
 const g=AC.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.006);g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
 o.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);g.connect(master);o.start(t0);o2.start(t0);o.stop(t0+dur+0.05);o2.stop(t0+dur+0.05)}
function thud(strength){ // 岩にあたる: 低い太鼓ふうの音 + しぶき
 if(!AC||!SND.on)return;const t0=AC.currentTime,v=Math.min(1,strength||1);
 const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,t0);o.frequency.exponentialRampToValueAtTime(45,t0+0.28);
 const g=AC.createGain();g.gain.setValueAtTime(0.9*v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.4);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.45);
 const sr=AC.sampleRate,n=Math.floor(sr*0.35),b=AC.createBuffer(1,n,sr),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
 const src=AC.createBufferSource();src.buffer=b;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=0.6;
 const ng=AC.createGain();ng.gain.value=0.35*v;src.connect(bp);bp.connect(ng);ng.connect(master);src.start(t0)}
function sndStart(){ensureAudio();HIRA.forEach((f,i)=>pluck(f,i*0.055,0.35,1.4))}                       // かき鳴らし(上へ)
function sndFish(){pluck(783.99,0,0.3,0.9);pluck(880,0.09,0.3,1.2)}
function sndClear(){[[587.33,0],[466.16,0.4],[440,0.8],[392,1.2],[440,1.8],[587.33,2.3],[783.99,2.8]].forEach(q=>pluck(q[0],q[1],0.45,2.4))}
function sndFail(){[[392,0],[311.13,0.45],[293.66,0.9],[146.83,1.5]].forEach(q=>pluck(q[0],q[1],0.4,2.6))}
function kotoTick(dt,k){ // ときどき琴を一つ二つ 爪弾く(早瀬のあいだは休む)
 if(!AC||!SND.on)return;kotoT-=dt;if(kotoT>0)return;
 if(k>1.15||mode==='fail'){kotoT=1.5;return}
 const base=Math.floor(Math.random()*HIRA.length);pluck(HIRA[base],0,0.3+Math.random()*0.15,2.2);
 if(Math.random()<0.45)pluck(HIRA[(base+2)%HIRA.length],0.28,0.25,2.0);
 kotoT=(mode==='idle'?3.5:2.8)+Math.random()*3.5}
function toggleSound(){SND.on=!SND.on;try{localStorage.setItem('h3_sound',SND.on?'on':'off')}catch(e){}
 if(!ensureAudio())return;master.gain.setTargetAtTime(SND.on?1:0,AC.currentTime,0.05);if(SND.on)pluck(587.33,0,0.3,1.2)}

// ================= 状態 =================
let mode='idle';           // idle | play | clear | fail
let testMode=9;            // 待機中の揺れ: 9=川 0=手動 1/2/3=テスト
let t={pitch:0,roll:0,yaw:0},cur={pitch:0,roll:0,yaw:0},gain=0.35,keys={},st={};
let flowT=0,scroll=0,last=performance.now();
const G={};                // ゲーム中の値
const COURSE_LEN=420;      // 川の長さ(単位)
const PZ=17.7;             // 桃の画面上の奥行き(yz(PZ)が画面の0.86の高さになる)
function newGame(){
 G.dist=0;G.u=0;G.vu=0;G.speed=4.5;G.kizu=0;G.hit=0;G.hitYaw=0;G.muteki=0;G.side=Math.random()<0.5?-1:1;G.result='';G.endT=0;G.steer=0;
 G.rocks=[];G.fish=[];
 // 岩: 手前は少なく、だんだん密に。時々「片側だけ空く」列
 for(let d=50;d<COURSE_LEN-50;d+=18+Math.random()*14){
  const r=Math.random();
  if(r<0.5)G.rocks.push({d,u:(Math.random()*2-1)*0.75,s:0.8+Math.random()*0.6});
  else if(r<0.8){const gap=(Math.random()*2-1)*0.6;for(let u=-0.85;u<=0.86;u+=0.42)if(Math.abs(u-gap)>0.38)G.rocks.push({d,u,s:0.7+Math.random()*0.3});}
  else{G.rocks.push({d,u:-0.9,s:0.9});G.rocks.push({d,u:0.9,s:0.9});}   // 両岸の岩: 真ん中を通るしかない=速くなる
 }
 for(let d=80;d<COURSE_LEN-70;d+=36+Math.random()*30)G.fish.push({d,u:Math.random()<0.5?-1.4:1.4,dir:0,sp:0.9+Math.random()*0.5,ph:Math.random()*7});
 for(const f of G.fish)f.dir=f.u<0?1:-1;
 mode='play';katari('start');$('kizu').style.display='block';$('anai').style.opacity=0;sndStart();
}
// 川の流れ: 距離ごとに横に押す力と速さ(読めるように、絵の波も同じ式でずらす)
function flowX(d){return Math.sin(d*0.045)*0.55+Math.sin(d*0.017+1.3)*0.35}
function flowK(d){if(d<40||d>COURSE_LEN-80)return 1;const s=Math.sin(d*0.03+0.7);return s>0.55?1+(s-0.55)*1.4:1}   // 早瀬(最大1.6倍)
function laneK(u){return 1.35-0.7*Math.min(1,Math.abs(u))}   // 真ん中が速く 岸ぎわが ゆるい
const SLOW_OK=4.2;   // これより ゆっくりなら おばあさんが 拾える

// ================= 入力 =================
addEventListener('keydown',e=>{keys[e.key]=1;if(!e.repeat)ensureAudio();
 if(e.key==='m'||e.key==='M'){toggleSound();return}
 const lr=['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key);
 if(mode==='idle'&&lr){newGame();return}
 if((mode==='clear'||mode==='fail')&&G.endT>4&&lr){mode='idle';toIdle();return}
 if(mode==='idle'){
  if(testMode===9&&['ArrowUp','ArrowDown'].includes(e.key))testMode=0;
  if(e.key==='0'||e.key==='9')testMode=9;if(e.key==='1')testMode=1;if(e.key==='2')testMode=2;if(e.key==='3')testMode=3;
  if(e.key===' '){testMode=0;t={pitch:0,roll:0,yaw:0}}}
 if(e.shiftKey&&/^[0-9]$/.test(e.code.replace('Digit','')))pad.axis=+e.code.replace('Digit','');
 if(e.key==='+'||e.key==='=')gain=Math.min(1,gain+0.05);if(e.key==='-')gain=Math.max(0,gain-0.05);
 if((e.key==='r'||e.key==='R')&&!STANDALONE)fetch('/reconnect').then(r=>r.json()).then(s=>st=s).catch(()=>{});
 if((e.key==='c'||e.key==='C')&&pad.ready){padCenters[pad.name+'#'+pad.axis]=pad.axes[pad.axis]||0;try{localStorage.setItem('h3_pad_center',JSON.stringify(padCenters))}catch(x){}}
 if(e.key==='h'||e.key==='H'){const h=$('help');h.style.display=h.style.display==='block'?'none':'block'}});
addEventListener('keyup',e=>keys[e.key]=0);
addEventListener('pointerdown',()=>ensureAudio());
// スティック: ブラウザは「ボタンを一度押す」まで機器を出さない(倒すだけでは気づかない)。
// 複数つながっている時(スティック+ペダル)は、動かした方の機器を舵に使う。
let pad={name:'',axes:[],axis:0,idx:-1,seen:0,ready:false,center:0};
let padCenters={};try{padCenters=JSON.parse(localStorage.getItem('h3_pad_center')||'{}')}catch(e){}   // axis: 舵に使う軸の番号(既定 0 = スティックの左右)
const padBase={};   // 機器ごとの最初に見た時の軸の値(静止位置)。ここから動いたら「使っている機器」と判断
function padAxis(){let gp=[];try{gp=navigator.getGamepads?navigator.getGamepads():[]}catch(e){}let seen=0;
 for(let i=0;i<gp.length;i++){const g=gp[i];if(!g)continue;seen++;
  const key=i+':'+g.id;const base=padBase[key]||(padBase[key]=Array.from(g.axes));
  let act=false;for(let j=0;j<g.axes.length;j++)if(Math.abs((g.axes[j]||0)-(base[j]||0))>0.3)act=true;
  for(const b of g.buttons||[])if(b&&b.pressed)act=true;
  if(act&&pad.idx!==i){pad.idx=i;pad.name=g.id||'';pad.ready=true}}
 pad.seen=seen;
 const g=pad.idx>=0?gp[pad.idx]:null;if(!g){if(seen===0){pad.idx=-1;pad.ready=false}return 0}
 pad.name=g.id||'';pad.axes=Array.from(g.axes);pad.center=padCenters[(g.id||'')+'#'+pad.axis]||0;
 let a=(g.axes[pad.axis]||0)-pad.center;a=a/(1-Math.min(0.8,Math.abs(pad.center)));if(Math.abs(a)>0.12)return Math.max(-1,Math.min(1,a*1.15));
 if(g.buttons[14]&&g.buttons[14].pressed)return -1;if(g.buttons[15]&&g.buttons[15].pressed)return 1;return 0}
addEventListener('gamepadconnected',e=>{if(pad.idx<0){pad.name=e.gamepad.id;pad.seen=Math.max(1,pad.seen)}});
addEventListener('gamepaddisconnected',e=>{if(e.gamepad.index===pad.idx){pad.idx=-1;pad.name='';pad.ready=false}delete padBase[e.gamepad.index+':'+e.gamepad.id]});
function toIdle(){$('kizu').style.display='none';$('anai').style.opacity=1;katari('idle');testMode=9}
if(!STANDALONE)setInterval(()=>fetch('/state').then(r=>r.json()).then(s=>st=s).catch(()=>{}),1000);
katari('idle',true);
if(location.hash==='#play'){newGame()}else if(location.hash==='#goal'){newGame();G.dist=COURSE_LEN-45;G.u=G.side*0.5}
else if(location.hash==='#clear'){newGame();G.dist=COURSE_LEN-1;G.u=G.side*0.8;G.vu=0}
else if(location.hash==='#fail'){newGame();G.dist=COURSE_LEN-1;G.u=0}

// ================= 揺れの計算 =================
function idleSway(dt){flowT+=dt;const s=flowT;
 t.pitch=Math.sin(s*0.8)*0.35+Math.sin(s*2.3)*0.12;t.roll=Math.sin(s*0.55+1)*0.45+Math.sin(s*1.9+0.5)*0.15;t.yaw=Math.sin(s*0.3+2)*0.35;return 1}
function playStep(dt){
 const k=flowK(G.dist);
 let inp=0;if(keys.ArrowLeft||keys.a||keys.A)inp-=1;if(keys.ArrowRight||keys.d||keys.D)inp+=1;const pa=padAxis();if(pa)inp=pa;
 G.steer+=(inp-G.steer)*Math.min(1,dt*6);            // 舵の反応(大きいほど機敏)
 const fx=flowX(G.dist);
 const same=G.steer*fx;                              // >0: 流れと同じ向き, <0: 逆らっている
 let eff=0.85;if(same<0)eff=0.85*Math.max(0.5,1-Math.abs(fx)*0.8);else if(same>0)eff=0.85+Math.abs(fx)*0.4;
 G.vu+=(G.steer*eff+fx*0.12-G.u*0.1)*dt;   // 舵 + 川の押し + 本流へ戻る力(弱)
 const withFlow=G.vu*fx>0;
 G.vu*=Math.pow(withFlow?0.22:0.1,dt);                // 流れに乗っていると少し止まりにくい
 if(Math.abs(G.u)>0.9&&G.vu*G.u>0)G.vu*=Math.pow(0.05,dt);   // 岸ぎわは浅くて進みにくい(外に出にくい)
 G.u+=G.vu*dt;
 G.sakarau=same<-0.15&&Math.abs(fx)>0.35;G.noru=withFlow&&Math.abs(G.vu)>0.5&&Math.abs(fx)>0.35;
 if(Math.abs(G.u)>1.08){G.result='fail_out';endGame();return k}   // 川の外へ
 G.speed=4.5*k*laneK(G.u);G.dist+=G.speed*dt;scroll+=dt*(0.6+0.25*G.speed/5+0.6*(k-1));
